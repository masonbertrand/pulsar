name: Build Pulsar

# Every push builds and tests Pulsar. Pushes to main also publish it, once the signing secrets are set, as a
# GitHub Release with an appcast; the installed app checks that appcast every few minutes and updates itself.
# Other branches only build and test, so work in progress never reaches the app.
#
# 28/10: GitHub's Mac runners are sometimes all busy, and a job waits until it gives up ("not acquired").
# So the same build runs on three kinds of Mac at once, and the first one that works is published.
# Each builds the Apple-silicon app for macOS 26 (PULSAR_TARGET), whatever the runner's own macOS or chip.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SIGNING_CERT_P12       base64 of the self-signed code-signing certificate (.p12)
#   SIGNING_CERT_PASSWORD  its password
#   SPARKLE_ED_PRIVATE_KEY the EdDSA private key that signs each update
# Without them the workflow still builds, ad-hoc signed, as a downloadable artifact only.

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write   # to publish releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public half of SPARKLE_ED_PRIVATE_KEY; the app uses it to check every update before installing it.
  ED_PUBLIC_KEY: 0tRPIY1Kr9r47GJ8+jE2ust3sQQrcSTXWQe2No2mRY8=
  FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PULSAR_TARGET: arm64-apple-macos26.0
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sw_vers
          uname -m
          xcrun swiftc --version

      - name: Tests
        run: ./tests.sh 2>&1 | tee build-tests.log; exit ${pipestatus[1]}
        shell: zsh {0}

      - name: Signing
        id: sign
        env:
          P12: ${{ secrets.SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$P12" ] || [ -z "$ED_PRIVATE_KEY" ]; then
            echo "::warning::Signing secrets not set: ad-hoc build, no automatic updates."
            exit 0
          fi
          KC="$RUNNER_TEMP/pulsar.keychain-db"; KP=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -p codesigning "$KC"
          HASH=$(security find-certificate -c "Pulsar Self-Signed" -Z "$KC" | awk '/SHA-1/ {print $NF}')
          printf '%s' "$ED_PRIVATE_KEY" > "$RUNNER_TEMP/ed_key"
          echo "identity=$HASH" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          PULSAR_BUILD_NUMBER: ${{ github.run_number }}
          PULSAR_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          PULSAR_FEED_URL: ${{ steps.sign.outputs.release && env.FEED_URL || '' }}
          PULSAR_ED_PUBLIC_KEY: ${{ steps.sign.outputs.release && env.ED_PUBLIC_KEY || '' }}
        shell: zsh {0}
        run: |
          set -e
          ./build.sh 2>&1 | tee build.log; [[ ${pipestatus[1]} == 0 ]]
          codesign --verify --deep --strict build/Pulsar.app
          codesign -d -r- build/Pulsar.app
          lipo -archs build/Pulsar.app/Contents/MacOS/Pulsar

      - name: Show compiler errors
        if: failure()
        # turns swiftc errors into annotations, readable on the run page and through the API
        run: |
          cat build-tests.log build.log 2>/dev/null | grep -E '^(/|[A-Za-z]).*:[0-9]+:[0-9]+: error: ' | sort -u | head -40 |
            sed -E 's#^('"$PWD"'/)?([^:]+):([0-9]+):([0-9]+): error: (.*)#::error file=\2,line=\3,col=\4::${{ matrix.runner }}: \2:\3 \5#'
          grep '^FAIL ' build-tests.log 2>/dev/null | sed 's/^/::error::/' || true

      - name: Package and sign the update
        # ditto keeps the symlinks inside Sparkle.framework, so the code signature stays valid
        run: |
          mkdir -p out
          ditto -c -k --keepParent build/Pulsar.app out/Pulsar.zip
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Pulsar.app/Contents/Info.plist > out/version.txt
          if [ -f "$RUNNER_TEMP/ed_key" ]; then
            Vendor/Sparkle/bin/sign_update --ed-key-file "$RUNNER_TEMP/ed_key" out/Pulsar.zip > out/sig.txt
            rm "$RUNNER_TEMP/ed_key"
            cat out/sig.txt
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: Pulsar-${{ matrix.runner }}
          path: out/
          retention-days: 30

  # Takes the first Mac that produced an app (in this order of preference) and, on main, publishes it.
  # On other branches it only checks that at least one did, so a branch build counts as passed.
  publish:
    name: Pick and publish
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: Pulsar-*
          path: art

      - name: Pick a build
        id: pick
        # with a single artifact the files may land straight in art/, with several in art/Pulsar-<runner>/
        run: |
          find art -type f | sort
          f=""
          for r in macos-26 macos-15 macos-26-intel; do
            f=$(find art -path "*Pulsar-$r/*" -name Pulsar.zip | head -1); [ -n "$f" ] && break
          done
          [ -z "$f" ] && f=$(find art -name Pulsar.zip | head -1)
          if [ -z "$f" ]; then echo "::error::No Mac produced a build."; exit 1; fi
          echo "Using $f"
          mkdir -p build && cp "$(dirname "$f")"/* build/
          echo "release=$([ -f build/sig.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish update
        if: steps.pick.outputs.release == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          SIG=$(cat build/sig.txt)
          TAG="build-$N"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/Pulsar.zip"
          git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' > build/notes.txt
          SIG="$SIG" URL="$URL" python3 - <<'EOF'
          import os, html, email.utils
          n, sig, url = os.environ["N"], os.environ["SIG"].strip(), os.environ["URL"]
          notes = html.escape(open("build/notes.txt").read().strip())
          short = open("build/version.txt").read().strip()
          open("build/appcast.xml", "w").write(f"""<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Pulsar</title>
              <item>
                <title>Pulsar {short} ({n})</title>
                <pubDate>{email.utils.formatdate()}</pubDate>
                <sparkle:version>{n}</sparkle:version>
                <sparkle:shortVersionString>{short} ({n})</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <description><![CDATA[<pre>{notes}</pre>]]></description>
                <enclosure url="{url}" type="application/octet-stream" {sig} />
              </item>
            </channel>
          </rss>
          """)
          EOF
          cat build/appcast.xml
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" build/Pulsar.zip build/appcast.xml --title "Pulsar build $N" --notes-file build/notes.txt --latest

      - name: Keep the last 10 releases
        if: steps.pick.outputs.release == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag -y; done
